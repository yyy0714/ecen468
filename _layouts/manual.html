---
layout: default
---
<nav class="mb-3">
  <a href="{{ '/' | relative_url }}" class="link-body-emphasis text-decoration-none">&larr; All labs</a>
</nav>

<h1 class="mb-2">{{ page.title }}</h1>

<hr class="mb-4">

{% assign body_text = content | strip_html | strip %}
{% if body_text == "" %}
<p class="text-body-secondary fst-italic">The manual for this lab will be posted here soon.</p>
{% else %}
<article class="manual">
{{ content }}
</article>
{% endif %}

<style>
  .manual { max-width: 54rem; }
  .manual img { max-width: 100%; height: auto; display: block; margin: 1.25rem auto; }
  .manual h2 { margin-top: 2.5rem; }
  .manual h3 { margin-top: 1.75rem; }
  .manual pre { background: var(--bs-tertiary-bg); padding: 1rem; border-radius: .375rem; overflow-x: auto; }
  .manual :not(pre) > code { background: var(--bs-tertiary-bg); padding: .15em .35em; border-radius: .25rem; }
  .manual table { border-collapse: collapse; margin: 1rem 0; }
  .manual table th, .manual table td { border: 1px solid var(--bs-border-color); padding: .4rem .6rem; }
</style>
